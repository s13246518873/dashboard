<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,user-scalable=no">

<title>Clock Dashboard</title>
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#888;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#screen{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
    width:100%;
}

.time{
    font-size:26vw;
    font-weight:200;
    line-height:1;
    color:#999;
    margin-bottom:35px;
}

.weekday{
    font-size:6vw;
    color:#777;
    margin-bottom:10px;
}

.date{
    font-size:5vw;
    color:#666;
    margin-bottom:20px;
}

.lunar{
    font-size:5vw;
    color:#666;
    margin-bottom:35px;
}

.weather{
    font-size:6vw;
    color:#888;
    margin-bottom:10px;
}

.temp{
    font-size:10vw;
    color:#999;
    margin-bottom:30px;
}

.line{
    width:60%;
    height:1px;
    background:#333;
    margin:0 auto 30px auto;
}

.offsets{
    display:flex;
    justify-content:space-around;
    align-items:center;
    color:#666;
}

.offsetBlock{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.offsetLabel{
    font-size:3vw;
    margin-bottom:10px;
}

.offsetTime{
    font-size:6vw;
}
</style>
</head>

<body>

<div id="screen">

    <div class="container">

        <div id="time" class="time">
            17:14
        </div>

        <div id="weekday" class="weekday">
            星期三
        </div>

        <div id="date" class="date">
            2026-11-25
        </div>

        <div id="lunar" class="lunar">
            农历 十月十六
        </div>

        <div id="weather" class="weather">
            佛山南海 多云
        </div>

        <div id="temp" class="temp">
            23℃
        </div>

        <div class="line"></div>

        <div class="offsets">

            <div class="offsetBlock">
                <div class="offsetLabel">-20分钟</div>
                <div id="prevTime" class="offsetTime">
                    16:54
                </div>
            </div>

            <div class="offsetBlock">
                <div class="offsetLabel">+20分钟</div>
                <div id="nextTime" class="offsetTime">
                    17:34
                </div>
            </div>

        </div>

    </div>

</div>
<script>
    function updateClock(){

    const now = new Date();

    document.getElementById('time').innerHTML =
        now.toLocaleTimeString(
            'zh-CN',
            {
                hour:'2-digit',
                minute:'2-digit',
                hour12:false
            }
        );

    document.getElementById('weekday').innerHTML =
        now.toLocaleDateString(
            'zh-CN',
            {
                weekday:'long'
            }
        );

    document.getElementById('date').innerHTML =
        now.toLocaleDateString('zh-CN');

    const prev =
        new Date(now.getTime()-20*60000);

    const next =
        new Date(now.getTime()+20*60000);

    document.getElementById('prevTime').innerHTML =
        prev.toLocaleTimeString(
            'zh-CN',
            {
                hour:'2-digit',
                minute:'2-digit',
                hour12:false
            }
        );

    document.getElementById('nextTime').innerHTML =
        next.toLocaleTimeString(
            'zh-CN',
            {
                hour:'2-digit',
                minute:'2-digit',
                hour12:false
            }
        );
}

updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>

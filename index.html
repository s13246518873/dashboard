<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Foshan Clock</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">

<style>

:root{
    --main:#d6d6d6;
    --sub:#9a9a9a;
    --line:#222;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:var(--main);
    font-family:
    "Inter",
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#screen{
    width:100vw;
    height:100vh;
    transition:transform 1s linear;
}

.container{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:10px;
    box-sizing:border-box;
}

.topline{
    font-size:5vw;
    font-weight:600;
    color:var(--sub);
    margin-bottom:15px;
}

.time{
    font-size:38vw;
    font-weight:800;
    line-height:0.9;
    letter-spacing:-6px;
    color:#e0e0e0;
}

.colon{
    animation:blink 1s infinite;
}

@keyframes blink{
    0%{opacity:1;}
    50%{opacity:0.2;}
    100%{opacity:1;}
}

.lunar{
    margin-top:12px;
    font-size:5vw;
    color:#b5b5b5;
}
.weatherRow{
    width:95%;
    margin-top:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}
.weatherCurrent{
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.weatherNow{
    font-size:8vw;
    font-weight:700;
    line-height:1;
}

.location{
    margin-top:8px;
    font-size:2.6vw;
    color:#777;
    line-height:1.2;
    text-align:left;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:20vw;
}

.hourly{
    display:flex;
    gap:10px;
    align-items:flex-start;
}

.hourBlock{
    text-align:center;
}

.hourIcon{
    font-size:4vw;
}

.hourTemp{
    font-size:3vw;
}

.hourTime{
    font-size:2.5vw;
    color:#777;
}
.divider{

    width:70%;
    height:1px;
    background:#222;
    margin:20px 0;
}

.forecast{

    width:98%;

    display:flex;

    justify-content:space-around;
}

.day{

    width:18%;

    text-align:center;
}

.icon{
    font-size:8vw;
}

.dayname{
    margin-top:5px;
    font-size:3.2vw;
    color:#888;
    font-weight:600;
    letter-spacing:0.5px;
}

.temp{
    margin-top:4px;
    font-size:4vw;
    color:#ddd;
}

</style>
</head>

<body>

<div id="screen">

<div class="container">

<div id="topline" class="topline">
2026年11月25日 星期三
</div>

<div class="time">
<span id="hh">17</span><span class="colon">:</span><span id="mm">58</span>
</div>

<div id="lunar" class="lunar">
农历加载中...
</div>
<div class="weatherRow">

<div class="weatherCurrent">

    <div>

        <div id="weatherNow" class="weatherNow">
            ☁️19°
        </div>

        <div id="location" class="location">
            定位中...
        </div>

    </div>

</div>

    <div id="hourly" class="hourly">
    </div>

</div>

<div class="divider"></div>

<div id="forecast" class="forecast"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/solarlunar@2.0.7/lib/solarlunar.min.js"></script>

<script>

function weatherIcon(code){

    if(code===0) return "☀️";

    if([1,2].includes(code)) return "🌤️";

    if(code===3) return "☁️";

    if([45,48].includes(code)) return "🌫️";

    if([
        51,53,55,56,57,
        61,63,65,66,67,
        80,81,82
    ].includes(code)) return "🌧️";

    if([95,96,99].includes(code))
        return "⛈️";

    return "☁️";
}

function updateClock(){

    const now=new Date();

    document.getElementById("hh").innerText=
        String(now.getHours()).padStart(2,'0');

    document.getElementById("mm").innerText=
        String(now.getMinutes()).padStart(2,'0');

    document.getElementById("topline").innerText=
        now.toLocaleDateString(
            "zh-CN",
            {
                year:'numeric',
                month:'long',
                day:'numeric'
            }
        )
        + " "
        +
        now.toLocaleDateString(
            "zh-CN",
            {
                weekday:'long'
            }
        );

    updateLunar();
    updateBrightness();
}

function updateLunar(){

    try{

        const now=new Date();

        const lunar=
        solarlunar.solar2lunar(
            now.getFullYear(),
            now.getMonth()+1,
            now.getDate()
        );

        document.getElementById("lunar").innerText=
            "农历 " +
            lunar.monthCn +
            lunar.dayCn;

    }catch(e){}
}
async function loadWeather(){

    try{

        let city = "佛山";
        let lat = 23.0289;
        let lon = 113.1415;

        try{

            const geo = await fetch(
                "https://ipwho.is/",
                {
                    cache:"no-store"
                }
            );

            const location =
                await geo.json();

            if(location.success !== false){

                city =
                    location.city ||
                    "佛山";

                lat =
                    location.latitude ||
                    lat;

                lon =
                    location.longitude ||
                    lon;
            }

        }catch(e){

            console.log(
                "IP定位失败，使用佛山默认位置"
            );
        }

        document
            .getElementById("location")
            .innerText =
            city;

        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode&daily=weathercode,temperature_2m_max&forecast_days=5&timezone=Asia%2FShanghai`;

        const r =
            await fetch(url);

        const d =
            await r.json();

        document
            .getElementById("weatherNow")
            .innerHTML =
                weatherIcon(
                    d.current_weather.weathercode
                ) +
                " " +
                Math.round(
                    d.current_weather.temperature
                ) +
                "°";

        const currentHour =
            new Date().getHours();

        let index =
            d.hourly.time.findIndex(
                t => t.includes(
                    String(currentHour)
                    .padStart(2,"0")
                    + ":00"
                )
            );

        if(index < 0){
            index = 0;
        }

        let hourlyHtml = "";

        for(let i=1;i<=7;i++){

            const arrIndex =
                Math.min(
                    index+i,
                    d.hourly.temperature_2m.length-1
                );

            const hour =
                (currentHour+i)%24;

            hourlyHtml += `
                <div class="hourBlock">
                    <div class="hourIcon">
                        ${weatherIcon(
                            d.hourly.weathercode[arrIndex]
                        )}
                    </div>
                    <div class="hourTemp">
                        ${Math.round(
                            d.hourly.temperature_2m[arrIndex]
                        )}°
                    </div>
                    <div class="hourTime">
                        ${String(hour)
                            .padStart(2,"0")}时
                    </div>
                </div>
            `;
        }

        document
            .getElementById("hourly")
            .innerHTML =
            hourlyHtml;

        let forecastHtml = "";

        for(let i=0;i<5;i++){

            const date =
                new Date(
                    d.daily.time[i]
                );

            forecastHtml += `
                <div class="day">
                    <div class="icon">
                        ${weatherIcon(
                            d.daily.weathercode[i]
                        )}
                    </div>
                    <div class="dayname">
                        ${
                            ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]
                            [date.getDay()]
                        }
                    </div>
                    <div class="temp">
                        ${Math.round(
                            d.daily.temperature_2m_max[i]
                        )}°
                    </div>
                </div>
            `;
        }

        document
            .getElementById("forecast")
            .innerHTML =
            forecastHtml;

    }catch(e){

        console.log(e);

        document
            .getElementById("location")
            .innerText =
            "佛山";
    }
}
function updateBrightness(){

    const h = new Date().getHours();

    if(h >= 22 || h < 9){

        document.body.style.filter =
            "brightness(10%)";

    }else{

        document.body.style.filter =
            "brightness(50%)";
    }
}

function antiBurn(){

    const pos=[
        [0,0],
        [2,0],
        [2,2],
        [0,2],
        [-2,2],
        [-2,0],
        [-2,-2],
        [0,-2],
        [2,-2]
    ];

    const idx=
        Math.floor(Date.now()/1200000)
        % pos.length;

    document.getElementById("screen")
        .style.transform=
        `translate(${pos[idx][0]}px,${pos[idx][1]}px)`;
}

async function keepAwake(){

    try{

        if("wakeLock" in navigator){

            await navigator.wakeLock.request("screen");
        }

    }catch(e){}
}

document.addEventListener(
"visibilitychange",
()=>{
    if(document.visibilityState==="visible"){
        keepAwake();
    }
}
);

updateClock();
loadWeather();
antiBurn();
keepAwake();

setInterval(updateClock,1000);
setInterval(loadWeather,1800000);
setInterval(antiBurn,1200000);

</script>

</body>
</html>

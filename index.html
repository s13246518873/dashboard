<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Foshan Clock</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">

<style>

:root{
    --main:#d6d6d6;
    --sub:#9a9a9a;
    --line:#222;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:var(--main);
    font-family:
    "Inter",
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#screen{
    width:100vw;
    height:100vh;
    transition:transform 1s linear;
}

.container{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:10px;
    box-sizing:border-box;
}

.topline{
    font-size:5vw;
    font-weight:600;
    color:var(--sub);
    margin-bottom:15px;
}

.time{
    font-size:38vw;
    font-weight:800;
    line-height:0.9;
    letter-spacing:-6px;
    color:#e0e0e0;
}

.colon{
    animation:blink 1s infinite;
}

@keyframes blink{
    0%{opacity:1;}
    50%{opacity:0.2;}
    100%{opacity:1;}
}

.lunar{
    margin-top:12px;
    font-size:5vw;
    color:#b5b5b5;
}
.weatherRow{
    width:95%;
    margin-top:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.weatherCurrent{

    display:flex;

    align-items:flex-start;

    gap:10px;
}

.weatherNow{

    font-size:8vw;

    font-weight:700;

    line-height:1;
}

.location{
    margin-top:8px;
    font-size:2.6vw;
    color:#777;
    line-height:1.2;
    text-align:left;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:20vw;
}

.weatherLabel{

    font-size:3.5vw;

    color:#888;

    line-height:1.15;

    text-align:center;
}

.hourly{
    display:flex;
    gap:10px;
    align-items:flex-start;
}


.hourBlock{

    text-align:center;
}
.hourBlock{

    text-align:center;
}

.hourIcon{

    font-size:5vw;
}

.hourTemp{

    font-size:3.8vw;
}

.hourTime{

    font-size:3vw;
    color:#777;
}

.divider{

    width:70%;
    height:1px;
    background:#222;
    margin:20px 0;
}

.forecast{

    width:98%;

    display:flex;

    justify-content:space-around;
}

.day{

    width:18%;

    text-align:center;
}

.icon{
    font-size:8vw;
}

.dayname{
    margin-top:5px;
    font-size:3.8vw;
    color:#999;
}

.temp{
    margin-top:4px;
    font-size:4vw;
    color:#ddd;
}

</style>
</head>

<body>

<div id="screen">

<div class="container">

<div id="topline" class="topline">
2026年11月25日 星期三
</div>

<div class="time">
<span id="hh">17</span><span class="colon">:</span><span id="mm">58</span>
</div>

<div id="lunar" class="lunar">
农历加载中...
</div>
<div class="weatherRow">

<div class="weatherCurrent">

    <div>

        <div id="weatherNow" class="weatherNow">
            ☁️19°
        </div>

        <div id="location" class="location">
            定位中...
        </div>

    </div>

</div>

    <div id="hourly" class="hourly">
    </div>

</div>

<div class="divider"></div>

<div id="forecast" class="forecast"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/solarlunar@2.0.7/lib/solarlunar.min.js"></script>

<script>

function weatherIcon(code){

    if(code===0) return "☀️";

    if([1,2].includes(code)) return "🌤️";

    if(code===3) return "☁️";

    if([45,48].includes(code)) return "🌫️";

    if([
        51,53,55,56,57,
        61,63,65,66,67,
        80,81,82
    ].includes(code)) return "🌧️";

    if([95,96,99].includes(code))
        return "⛈️";

    return "☁️";
}

function updateClock(){

    const now=new Date();

    document.getElementById("hh").innerText=
        String(now.getHours()).padStart(2,'0');

    document.getElementById("mm").innerText=
        String(now.getMinutes()).padStart(2,'0');

    document.getElementById("topline").innerText=
        now.toLocaleDateString(
            "zh-CN",
            {
                year:'numeric',
                month:'long',
                day:'numeric'
            }
        )
        + " "
        +
        now.toLocaleDateString(
            "zh-CN",
            {
                weekday:'long'
            }
        );

    updateLunar();
    updateBrightness();
}

function updateLunar(){

    try{

        const now=new Date();

        const lunar=
        solarlunar.solar2lunar(
            now.getFullYear(),
            now.getMonth()+1,
            now.getDate()
        );

        document.getElementById("lunar").innerText=
            "农历 " +
            lunar.monthCn +
            lunar.dayCn;

    }catch(e){}
}
async function loadWeather(){

    try{

        navigator.geolocation.getCurrentPosition(

            async(pos)=>{

                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                //
                // 地址
                //
                try{

                    const geo =
                    await fetch(
                        `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`
                    );

                    const addr =
                    await geo.json();

                    let city =
                        addr.address.city ||
                        addr.address.municipality ||
                        addr.address.town ||
                        addr.address.county ||
                        addr.address.state ||
                        "";

                    if(!city){

                        city =
                            addr.display_name
                            ?.split(",")[0]
                            || "";
                    }

                    city =
                    city
                        .replace("市","")
                        .replace("特别行政区","")
                        .replace("自治州","");

                    document
                        .getElementById("location")
                        .innerText = city;

                }catch(e){

                    document
                        .getElementById("location")
                        .innerText = "";
                }

                //
                // 天气
                //
                const url =
                `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode&daily=weathercode,temperature_2m_max&forecast_days=5&timezone=Asia%2FShanghai`;

                const r =
                await fetch(url);

                const d =
                await r.json();

                const current =
                d.current_weather;

                document
                .getElementById("weatherNow")
                .innerHTML =
                    weatherIcon(
                        current.weathercode
                    )
                    + " "
                    + Math.round(
                        current.temperature
                    )
                    + "°";

                //
                // 当前小时索引
                //
                const now =
                new Date();

                const currentHour =
                now.getHours();

                let index =
                d.hourly.time.findIndex(
                    t=>t.includes(
                        String(currentHour)
                        .padStart(2,"0")
                        +":00"
                    )
                );

                if(index < 0){
                    index = 0;
                }

                //
                // 未来7小时
                //
                let hourlyHtml = "";

                for(let i=1;i<=7;i++){

                    const hour =
                    (currentHour+i)%24;

                    const arrIndex =
                    Math.min(
                        index+i,
                        d.hourly.temperature_2m.length-1
                    );

                    hourlyHtml += `
                    <div class="hourBlock">

                        <div class="hourIcon">
                            ${weatherIcon(
                                d.hourly.weathercode[arrIndex]
                            )}
                        </div>

                        <div class="hourTemp">
                            ${Math.round(
                                d.hourly.temperature_2m[arrIndex]
                            )}°
                        </div>

                        <div class="hourTime">
                            ${String(hour)
                                .padStart(2,"0")}时
                        </div>

                    </div>
                    `;
                }

                document
                .getElementById("hourly")
                .innerHTML =
                hourlyHtml;

                //
                // 未来5天
                //
                let html = "";

                for(let i=0;i<5;i++){

                    const date =
                    new Date(
                        d.daily.time[i]
                    );

                    html += `
                    <div class="day">

                        <div class="icon">
                            ${weatherIcon(
                                d.daily.weathercode[i]
                            )}
                        </div>

                        <div class="dayname">
                            ${
                                ["日","一","二","三","四","五","六"]
                                [date.getDay()]
                            }
                        </div>

                        <div class="temp">
                            ${Math.round(
                                d.daily.temperature_2m_max[i]
                            )}°
                        </div>

                    </div>
                    `;
                }

                document
                    .getElementById("forecast")
                    .innerHTML =
                    html;

            },

            ()=>{

                document
                    .getElementById("location")
                    .innerText =
                    "定位关闭";

            },

            {
                enableHighAccuracy:false,
                timeout:10000,
                maximumAge:1800000
            }

        );

    }catch(e){

        console.log(e);

    }
}

function updateBrightness(){

    const h=new Date().getHours();
if(h>=22 || h<9){

    document.body.style.filter=
        "brightness(10%)";

}else{

    document.body.style.filter=
        "brightness(50%)";
}
}

function antiBurn(){

    const pos=[
        [0,0],
        [2,0],
        [2,2],
        [0,2],
        [-2,2],
        [-2,0],
        [-2,-2],
        [0,-2],
        [2,-2]
    ];

    const idx=
        Math.floor(Date.now()/1200000)
        % pos.length;

    document.getElementById("screen")
        .style.transform=
        `translate(${pos[idx][0]}px,${pos[idx][1]}px)`;
}

async function keepAwake(){

    try{

        if("wakeLock" in navigator){

            await navigator.wakeLock.request("screen");
        }

    }catch(e){}
}

document.addEventListener(
"visibilitychange",
()=>{
    if(document.visibilityState==="visible"){
        keepAwake();
    }
}
);

updateClock();
loadWeather();
antiBurn();
keepAwake();

setInterval(updateClock,1000);
setInterval(loadWeather,1800000);
setInterval(antiBurn,1200000);

</script>

</body>
</html>

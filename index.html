<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Foshan Clock</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">

<style>

:root{
    --main:#d6d6d6;
    --sub:#9a9a9a;
    --line:#222;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:var(--main);
    font-family:
    "Inter",
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#screen{
    width:100vw;
    height:100vh;
    transition:transform 1s linear;
}

.container{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.topline{
    font-size:5vw;
    font-weight:600;
    color:var(--sub);
    margin-bottom:18px;
}

.time{
    font-size:35vw;
    font-weight:800;
    line-height:0.9;
    letter-spacing:-6px;
    color:#e0e0e0;
}

.colon{
    animation:blink 1s infinite;
}

@keyframes blink{
    0%{opacity:1;}
    50%{opacity:0.2;}
    100%{opacity:1;}
}

.lunar{
    margin-top:20px;
    font-size:5vw;
    color:#b5b5b5;
}

.weatherRow{

    width:92%;

    margin-top:30px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.weatherNow{
    font-size:7vw;
    font-weight:700;
    white-space:nowrap;
}

.hourly{

    text-align:right;

    font-size:3.8vw;

    line-height:1.4;

    color:#aaa;
}

.divider{
    width:70%;
    height:1px;
    background:var(--line);
    margin:24px 0;
}

.forecast{
    width:96%;
    display:flex;
    justify-content:space-around;
}

.day{
    width:18%;
}

.icon{
    font-size:8vw;
}

.dayname{
    margin-top:6px;
    font-size:3.8vw;
    color:#999;
}

.temp{
    margin-top:4px;
    font-size:4vw;
    color:#ddd;
}

</style>
</head>

<body>

<div id="screen">

<div class="container">

<div id="topline" class="topline">
2026年11月25日 星期三
</div>

<div class="time">
<span id="hh">17</span><span class="colon">:</span><span id="mm">49</span>
</div>

<div id="lunar" class="lunar">
农历加载中...
</div>

<div class="weatherRow">

<div id="weatherNow" class="weatherNow">
☁️ 佛山 24°
</div>

<div id="hourly" class="hourly">
18时 ☁️24°<br>
19时 ☁️24°<br>
20时 🌧️23°
</div>

</div>

<div class="divider"></div>

<div id="forecast" class="forecast"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/solarlunar@2.0.7/lib/solarlunar.min.js"></script>

<script>

function weatherIcon(code){

    if(code===0) return "☀️";

    if([1,2].includes(code))
        return "🌤️";

    if(code===3)
        return "☁️";

    if([45,48].includes(code))
        return "🌫️";

    if([
        51,53,55,56,57,
        61,63,65,66,67,
        80,81,82
    ].includes(code))
        return "🌧️";

    if([
        95,96,99
    ].includes(code))
        return "⛈️";

    return "☁️";
}



function updateClock(){

    const now=new Date();

    document.getElementById("hh").innerText=
        String(now.getHours()).padStart(2,'0');

    document.getElementById("mm").innerText=
        String(now.getMinutes()).padStart(2,'0');

    document.getElementById("topline").innerText=

        now.toLocaleDateString(
            "zh-CN",
            {
                year:'numeric',
                month:'long',
                day:'numeric'
            }
        )
        +" "
        +
        now.toLocaleDateString(
            "zh-CN",
            {
                weekday:'long'
            }
        );

    updateLunar();
    updateBrightness();
}



function updateLunar(){

    try{

        const now=new Date();

        const lunar=
        solarlunar.solar2lunar(
            now.getFullYear(),
            now.getMonth()+1,
            now.getDate()
        );

        document.getElementById("lunar").innerText=
            "农历 " +
            lunar.monthCn +
            lunar.dayCn;

    }catch(e){}
}



async function loadWeather(){

    try{

        const url=
"https://api.open-meteo.com/v1/forecast?latitude=23.03&longitude=113.15&current_weather=true&hourly=temperature_2m,weathercode&daily=weathercode,temperature_2m_max&forecast_days=5&timezone=Asia%2FShanghai";

        const r=await fetch(url);

        const d=await r.json();

        const current=d.current_weather;

        document.getElementById("weatherNow").innerHTML=

            weatherIcon(current.weathercode)
            +
            " 佛山 "
            +
            Math.round(current.temperature)
            +
            "°";



        const currentHour=
        new Date().getHours();

        const index=
        d.hourly.time.findIndex(
            x=>x.includes(
                String(currentHour).padStart(2,'0')
                +":00"
            )
        );

        let hourlyHtml="";

        for(let i=1;i<=3;i++){

            const h=
            (currentHour+i)%24;

            hourlyHtml+=

            String(h).padStart(2,'0')
            + "时 "

            + weatherIcon(
              d.hourly.weathercode[index+i]
              )

            + " "

            + Math.round(
              d.hourly.temperature_2m[index+i]
              )

            + "°";

            if(i<3)
                hourlyHtml+="<br>";
        }

        document.getElementById("hourly")
        .innerHTML=
        hourlyHtml;



        let html="";

        for(let i=0;i<5;i++){

            const date=
            new Date(d.daily.time[i]);

            html+=`

            <div class="day">

            <div class="icon">
            ${weatherIcon(
                d.daily.weathercode[i]
            )}
            </div>

            <div class="dayname">
            ${["日","一","二","三","四","五","六"][date.getDay()]}
            </div>

            <div class="temp">
            ${Math.round(
             d.daily.temperature_2m_max[i]
            )}°
            </div>

            </div>

            `;
        }

        document.getElementById("forecast")
        .innerHTML=
        html;

    }catch(e){

        console.log(e);
    }
}



function updateBrightness(){

    const h=new Date().getHours();

    if(h>=22 || h<9){

        document.body.style.filter=
        "brightness(20%)";

    }else{

        document.body.style.filter=
        "brightness(60%)";
    }
}



function antiBurn(){

    const pos=[
        [0,0],
        [2,0],
        [2,2],
        [0,2],
        [-2,2],
        [-2,0],
        [-2,-2],
        [0,-2],
        [2,-2]
    ];

    const i=
    Math.floor(Date.now()/1200000)
    %
    pos.length;

    document.getElementById("screen")
    .style.transform=
    `translate(${pos[i][0]}px,${pos[i][1]}px)`;

}



async function keepAwake(){

    try{

        if("wakeLock" in navigator){

            await navigator
            .wakeLock
            .request("screen");
        }

    }catch(e){}
}



document.addEventListener(
"visibilitychange",
()=>{
    if(document.visibilityState==="visible")
        keepAwake();
}
);



updateClock();
loadWeather();
antiBurn();
keepAwake();

setInterval(updateClock,1000);
setInterval(loadWeather,1800000);
setInterval(antiBurn,1200000);

</script>

</body>
</html>

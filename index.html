<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,height=device-height,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Foshan Clock</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">

<style>

:root{
    --main:#d0d0d0;
    --sub:#929292;
    --line:#222;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#000;
    color:var(--main);
}

body{
    font-family:
    "Inter",
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
}

#screen{
    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:transform 1s linear;
}

.main{
    width:100%;
    text-align:center;
}

.time{
    font-size:30vw;
    font-weight:800;
    line-height:1;
    color:#ddd;

    letter-spacing:-5px;
}

.colon{
    animation:blink 1s infinite;
}

@keyframes blink{

    0%{
        opacity:1;
    }

    50%{
        opacity:.25;
    }

    100%{
        opacity:1;
    }
}

.weekday{

    margin-top:20px;

    font-size:6vw;
    font-weight:700;

    color:var(--sub);
}

.date{

    margin-top:8px;

    font-size:4.8vw;

    color:var(--sub);
}

.lunar{

    margin-top:20px;

    font-size:5vw;

    color:#b0b0b0;
}

.gz{

    margin-top:8px;

    line-height:1.6;

    font-size:4.2vw;

    color:#888;
}

.weather{

    margin-top:25px;

    font-size:8vw;

    font-weight:700;
}

.weatherDetail{

    font-size:4.5vw;
    color:var(--sub);
}

.divider{

    width:65%;
    height:1px;

    background:var(--line);

    margin:25px auto;
}

.forecast{

    width:95%;

    margin:auto;

    display:flex;

    justify-content:space-around;
}

.day{

    width:18%;
}

.icon{

    font-size:8vw;
}

.dayname{

    font-size:3.5vw;
    color:#888;

    margin-top:5px;
}

.temp{

    font-size:4vw;
    color:#ccc;

    margin-top:3px;
}

</style>

</head>

<body>

<div id="screen">

<div class="main">

<div class="time">
<span id="hh">17</span>
<span class="colon">:</span>
<span id="mm">34</span>
</div>

<div id="weekday" class="weekday"></div>

<div id="date" class="date"></div>

<div id="lunar" class="lunar">
农历加载中...
</div>

<div id="gz" class="gz"></div>

<div id="weather" class="weather">
佛山
</div>

<div id="weatherDetail" class="weatherDetail">
加载天气...
</div>

<div class="divider"></div>

<div id="forecast" class="forecast"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/solarlunar@2.0.7/lib/solarlunar.min.js"></script>

<script>

function weatherIcon(code){

    if(code===0) return "☀️";

    if([1,2].includes(code))
        return "🌤️";

    if(code===3)
        return "☁️";

    if(
        [45,48].includes(code)
    )
        return "🌫️";

    if(
        [51,53,55,56,57,
         61,63,65,66,67,
         80,81,82].includes(code)
    )
        return "🌧️";

    if(
        [71,73,75,77,
         85,86].includes(code)
    )
        return "❄️";

    if(
        [95,96,99].includes(code)
    )
        return "⛈️";

    return "☁️";
}

function updateClock(){

    const now = new Date();

    document.getElementById("hh").innerText =
        String(now.getHours()).padStart(2,"0");

    document.getElementById("mm").innerText =
        String(now.getMinutes()).padStart(2,"0");

    document.getElementById("weekday").innerText =
        now.toLocaleDateString(
            "zh-CN",
            {weekday:"long"}
        );

    document.getElementById("date").innerText =
        now.toLocaleDateString(
            "zh-CN",
            {
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );

    updateBrightness();
    updateLunar();
}

function updateLunar(){

    try{

        const now = new Date();

        const lunar =
        solarlunar.solar2lunar(
            now.getFullYear(),
            now.getMonth()+1,
            now.getDate()
        );

        document.getElementById("lunar").innerHTML=
            `农历 ${lunar.monthCn}${lunar.dayCn}`;

        document.getElementById("gz").innerHTML=
            `${lunar.gzYear}年<br>
             ${lunar.gzMonth}月<br>
             ${lunar.gzDay}日`;

    }catch(e){}
}

async function loadWeather(){

    try{

        const url=
        "https://api.open-meteo.com/v1/forecast?latitude=23.03&longitude=113.15&daily=weathercode,temperature_2m_max&current_weather=true&timezone=Asia%2FShanghai";

        const r=await fetch(url);

        const d=await r.json();

        const current=d.current_weather;

        document.getElementById("weather")
        .innerHTML=
        `${weatherIcon(current.weathercode)}
         ${Math.round(current.temperature)}°`;

        document.getElementById("weatherDetail")
        .innerHTML=
        `佛山南海`;

        const days=d.daily.time;

        let html="";

        for(let i=0;i<5;i++){

            const date=
                new Date(days[i]);

            html+=`
            <div class="day">

                <div class="icon">
                ${weatherIcon(
                    d.daily.weathercode[i]
                )}
                </div>

                <div class="dayname">
                ${["日","一","二","三","四","五","六"]
                [date.getDay()]}
                </div>

                <div class="temp">
                ${Math.round(
                d.daily.temperature_2m_max[i]
                )}°
                </div>

            </div>
            `;
        }

        document
        .getElementById("forecast")
        .innerHTML=html;

    }catch(e){

        document
        .getElementById("weatherDetail")
        .innerText="天气加载失败";
    }
}

function updateBrightness(){

    let h=new Date().getHours();

    if(h>=22 || h<9){

        document.body.style.filter=
            "brightness(20%)";

    }else{

        document.body.style.filter=
            "brightness(60%)";
    }
}

function antiBurn(){

    const pos=[
        [0,0],
        [2,0],
        [2,2],
        [0,2],
        [-2,2],
        [-2,0],
        [-2,-2],
        [0,-2],
        [2,-2]
    ];

    const idx=
    Math.floor(Date.now()/1200000)
    % pos.length;

    document.getElementById("screen")
    .style.transform=
    `translate(${pos[idx][0]}px,${pos[idx][1]}px)`;
}

async function keepAwake(){

    try{

        if("wakeLock" in navigator){

            await navigator
            .wakeLock
            .request("screen");
        }

    }catch(e){}
}

document.addEventListener(
"visibilitychange",
()=>{
    if(document.visibilityState==="visible"){
        keepAwake();
    }
}
);

updateClock();
loadWeather();
antiBurn();
keepAwake();

setInterval(updateClock,1000);
setInterval(loadWeather,1800000);
setInterval(antiBurn,1200000);

</script>

</body>
</html>
